[package]
name = "dynasm"
version.workspace = true
authors.workspace = true
edition.workspace = true

description = "A plugin for assembling code at runtime. Combined with the runtime crate dynasmrt it can be used to write JIT compilers easily."

documentation.workspace = true
repository.workspace = true

readme.workspace = true
keywords.workspace = true
license.workspace = true

[lib]
name = "dynasm"
proc-macro = true

[dependencies]
lazy_static = "1.5.0"
bitflags = "2.10.0"
byteorder = "1.5.0"
quote = "1.0.44"
proc-macro-error3 = "3.0.3"

[dependencies.syn]
version = "2.0.114"
features = ["full", "extra-traits"]

[dependencies.proc-macro2]
version = "1.0.106"

[features]
dynasm_opmap = []
dynasm_extract = []
filelocal = []
# Allow the expansions of `dynasm` macro use runtime-only functions, such as the automatic
# `.into()` conversions of the dynamic registers. Disabling this featue allows `dynasm!` output to
# be evaluated in `const {}` contexts.
runtime_computations = []

default = ["runtime_computations"]
